<!doctype html>

<html lang="es"><head><meta charset="utf-8">

  .huellas { position: absolute; right: 90px; bottom: 70px; }
  .demo { position: absolute; left: 70px; bottom: 52px; font-size: 18px; color: #E4DACB; }

    <g transform="translate(80 160)"><ellipse rx="34" ry="62"/><ellipse rx="22" ry="42" cy="6"/><ellipse rx="10" ry="20" cy="12"/></g>
    <g transform="translate(180 130)"><ellipse rx="34" ry="62"/><ellipse rx="22" ry="42" cy="6"/><ellipse rx="10" ry="20" cy="12"/></g>
