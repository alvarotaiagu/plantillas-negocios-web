<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@300..700&family=Literata:ital,opsz,wght@0,7..72,250;1,7..72,300&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:#F4E9E1;font-family:"Albert Sans";color:#1E2235;position:relative}

h1 em{display:block;color:#8A3628;font-weight:300;padding-left:90px}

.pie{position:absolute;left:72px;bottom:120px;font-size:20px;color:#585467;letter-spacing:.04em}
svg.o{position:absolute;right:40px;top:110px;width:470px;height:470px}
.demo{position:absolute;left:72px;top:520px;bottom:auto;font-size:15px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;border:1.5px solid #8A3628;color:#8A3628;border-radius:99px;padding:6px 14px}
</style></head><body>
<div class="barra">¿Estás en crisis? Llama al <b>024</b> · gratuito, 24 horas</div>

<ellipse cx="190" cy="350" rx="150" ry="22" fill="#1E2235" opacity=".08"/>
<g clip-path="url(#c)" fill="none" stroke-width="2.2" id="g"></g>
<circle cx="190" cy="190" r="140" fill="none" stroke="#283463" stroke-width="2"/>
<path d="M326 220 C 360 240, 372 300, 340 340 S 280 380, 330 396" fill="none" stroke="#B4533F" stroke-width="3.5" stroke-linecap="round"/></svg>

<script>
var g=document.getElementById('g'),h='',cols=['#283463','#283463','#B4533F','#283463','#D9A84E','#283463','#283463','#B4533F'];

g.innerHTML=h;
</script>
